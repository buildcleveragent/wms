# See https://pre-commit.com for usage
default_language_version:
  python: python3

exclude: |
  ^(
    frontend/node_modules/|
    staticfiles/|
    static/|
    .git/|
    .idea/|
    .venv/|
    __pycache__/|
    fixtures.*|fixture.*|
    test$|.*\.webp$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: local
    hooks:
      - id: lint-ratchet
        name: Black/isort/Ruff/Flake8 debt ratchet
        entry: python scripts/lint_ratchet.py
        language: system
        pass_filenames: false

  # Optional: lightweight security scan before push
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: bandit (scan allapp/)
        args: ["-ll", "-r", "allapp/"]
        stages: [pre-push]
