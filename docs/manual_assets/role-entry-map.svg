<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<title>WMS 六类角色与主要系统入口</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7890b5"/></marker></defs>
<style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif}.role{font-size:25px;font-weight:700;fill:#14233d}.desc{font-size:19px;fill:#53647e}.app{font-size:25px;font-weight:700;fill:white}.appdesc{font-size:18px;fill:#eaf1ff}</style>
<rect width="1400" height="800" rx="32" fill="#f4f8ff"/>
<text x="70" y="70" class="role" style="font-size:34px">角色与系统入口</text>
<text x="70" y="110" class="desc">按主要入口选择应用；角色决定操作能力，显式货主或仓库范围决定可见数据</text>
<g><rect x="70" y="148" width="500" height="84" rx="18" fill="white"/>
<text x="94" y="181" class="role">仓库操作员</text><text x="94" y="212" class="desc">移动作业、扫码、库存查询</text>
<path d="M580 190 H663" stroke="#7890b5" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="680" y="148" width="650" height="84" rx="18" fill="#155eef"/>
<text x="704" y="181" class="app">仓库 PDA</text><text x="704" y="212" class="appdesc">wmspda；移库、补货须启用功能开关</text></g>
<g><rect x="70" y="248" width="500" height="84" rx="18" fill="white"/>
<text x="94" y="281" class="role">仓库管理员</text><text x="94" y="312" class="desc">单据确认、任务管理、库存监督</text>
<path d="M580 290 H663" stroke="#7890b5" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="680" y="248" width="650" height="84" rx="18" fill="#26364f"/>
<text x="704" y="281" class="app">Web 控制台 / Admin</text><text x="704" y="312" class="appdesc">必要时使用仓库 PDA；计费另需财务权限</text></g>
<g><rect x="70" y="348" width="500" height="84" rx="18" fill="white"/>
<text x="94" y="381" class="role">系统管理员</text><text x="94" y="412" class="desc">账号权限、基础资料、配置与审计</text>
<path d="M580 390 H663" stroke="#7890b5" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="680" y="348" width="650" height="84" rx="18" fill="#26364f"/>
<text x="704" y="381" class="app">Web 控制台 / Admin</text><text x="704" y="412" class="appdesc">普通后台账号仍受角色、权限和数据范围限制</text></g>
<g><rect x="70" y="448" width="500" height="84" rx="18" fill="white"/>
<text x="94" y="481" class="role">货主业务员</text><text x="94" y="512" class="desc">开单、提交、查询与批量导入</text>
<path d="M580 490 H663" stroke="#7890b5" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="680" y="448" width="650" height="84" rx="18" fill="#117864"/>
<text x="704" y="481" class="app">货主业务端</text><text x="704" y="512" class="appdesc">wmsownersale</text></g>
<g><rect x="70" y="548" width="500" height="84" rx="18" fill="white"/>
<text x="94" y="581" class="role">货主管理员</text><text x="94" y="612" class="desc">货主审核、库存、账单与报表</text>
<path d="M580 590 H663" stroke="#7890b5" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="680" y="548" width="650" height="84" rx="18" fill="#117864"/>
<text x="704" y="581" class="app">货主业务端</text><text x="704" y="612" class="appdesc">wmsownersale</text></g>
<g><rect x="70" y="648" width="500" height="84" rx="18" fill="white"/>
<text x="94" y="681" class="role">仓库老板</text><text x="94" y="712" class="desc">经营总览、库容、收入与预警</text>
<path d="M580 690 H663" stroke="#7890b5" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="680" y="648" width="650" height="84" rx="18" fill="#7c3aed"/>
<text x="704" y="681" class="app">仓储经营分析中心</text><text x="704" y="712" class="appdesc">wmsbossbilling；仅查看授权范围</text></g>
<text x="70" y="773" class="desc">POS 需独立权限；商城买家通过商城小程序进入，不属于这六类 WMS 后台角色。</text></svg>
