name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feat/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'

# 最小权限（可按需在各 job 层覆盖）
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12.13'
  NODE_VERSION: '20'
  MYSQL_IMAGE: 'mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b'
  REDIS_IMAGE: 'redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf'

jobs:
  pda-client:
    name: PDA Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: wmspda/package-lock.json
      - run: npm ci
        working-directory: wmspda
      - run: npm audit --omit=dev --audit-level=high
        working-directory: wmspda
      - run: npm run test:unit
        working-directory: wmspda
      - run: npm run build:h5
        working-directory: wmspda
      - run: npx playwright install --with-deps chromium
        working-directory: wmspda
      - run: npm run test:e2e
        working-directory: wmspda

  owner-sale-client:
    name: Owner Sale Client
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.WMS_PUBLIC_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: wmsownersale/package-lock.json
      - run: npm ci
        working-directory: wmsownersale
      - run: npm audit --omit=dev --audit-level=high
        working-directory: wmsownersale
      - run: npm run test:quality
        working-directory: wmsownersale

  boss-client:
    name: Boss Client
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.WMS_PUBLIC_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: wmsbossbilling/package-lock.json
      - run: npm ci
        working-directory: wmsbossbilling
      - run: npm audit --omit=dev --audit-level=high
        working-directory: wmsbossbilling
      - run: npx playwright install --with-deps chromium
        working-directory: wmsbossbilling
      - run: npm run test:release
        working-directory: wmsbossbilling

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements/*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/dev.txt
          pip install bandit==1.9.4 pip-audit==2.10.1 pip-tools==7.5.1
      - name: Verify dependency locks are reproducible
        env:
          PIP_TOOLS_CACHE_DIR: /tmp/wms-pip-tools
          CUSTOM_COMPILE_COMMAND: python3.12 -m piptools compile --generate-hashes --reuse-hashes
        run: |
          python -m piptools compile --generate-hashes --reuse-hashes requirements/requirements.in
          python -m piptools compile --generate-hashes --reuse-hashes requirements/prod.in
          python -m piptools compile --generate-hashes --reuse-hashes requirements/dev.in
          python -m piptools compile --generate-hashes --reuse-hashes requirements/test.in
          git diff --exit-code -- requirements/requirements.txt requirements/prod.txt requirements/dev.txt requirements/test.txt
      - name: Production configuration check
        env:
          APP_ENV: production
          DEBUG: 'False'
          SECRET_KEY: ci-only-deploy-check-key-0123456789abcdef0123456789abcdef
          ALLOWED_HOSTS: wms.example.invalid
          CORS_ALLOWED_ORIGINS: https://wms.example.invalid
          CSRF_TRUSTED_ORIGINS: https://wms.example.invalid
          WECHAT_MINI_APPID: wx-ci-deploy-check
          WECHAT_PAY_MCH_ID: '1900000001'
          WECHAT_PAY_MCH_SERIAL_NO: ci-merchant-serial
          WECHAT_PAY_PRIVATE_KEY_PATH: /tmp/wms-ci-pay-private.pem
          WECHAT_PAY_APIV3_KEY: ci-only-api-v3-key-32-bytes-0000
          WECHAT_PAY_NOTIFY_URL: https://wms.example.invalid/api/sale-mini/payments/wechat/notify/
          WECHAT_PAY_REFUND_NOTIFY_URL: https://wms.example.invalid/api/sale-mini/refunds/wechat/notify/
          WECHAT_PAY_PLATFORM_KEYS: '{"ci-platform-serial":"/tmp/wms-ci-pay-public.pem"}'
          WECHAT_PAY_VERIFY_CALLBACK_SIGNATURE: 'True'
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/wms-ci-pay-private.pem
          openssl pkey -in /tmp/wms-ci-pay-private.pem -pubout -out /tmp/wms-ci-pay-public.pem
          python manage.py check --deploy
      - name: Enforce lint debt ratchet
        run: python scripts/lint_ratchet.py --previous-baseline-ref HEAD^
      - name: Bandit
        run: >-
          bandit -r allapp/ -ll
          -x 'allapp/*/migrations/*,allapp/*/test*.py,allapp/*/tests.py'
      - name: Validate security exceptions
        run: python scripts/validate_security_exceptions.py docs/security-exceptions.yml --max-days 30
      - name: Python dependency audit
        run: pip-audit -r requirements/prod.txt --cache-dir /tmp/pip-audit --ignore-vuln PYSEC-2026-3412

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [lint, test-serial, identifier-migrations]
    services:
      mysql:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: wms_db_test
          MYSQL_USER: wms_app
          MYSQL_PASSWORD: testpass123
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpassword || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
      redis:
        image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
        options: >-
          --health-cmd="redis-cli ping || exit 1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
          --health-start-period=10s
    strategy:
      fail-fast: false
      matrix:
        test-group: [platform, warehouse, settlement, pos-sales, business-flows]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements/*.txt
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libmysqlclient-dev
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/test.txt
      - name: Wait for DB ready (extra guard)
        run: |
          for i in {1..60}; do
            if python - <<'PY'
            import sys, socket
            s = socket.socket()
            try:
              s.connect(("mysql", 3306))
              sys.exit(0)
            except Exception:
              sys.exit(1)
            PY
            then
              echo "MySQL ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "MySQL did not become ready" >&2
              exit 1
            fi
            sleep 2
          done
      - name: Set up test env & migrate
        env:
          DB_NAME: wms_db_test
          DB_TEST_NAME: wms_ci_shard
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: mysql
          DB_PORT: 3306
          REDIS_HOST: redis
          REDIS_PORT: 6379
          SECRET_KEY: ci-test-key-0123456789abcdef0123456789abcdef0123456789abcdef
          DEBUG: 'False'
          DJANGO_SETTINGS_MODULE: wmsmaster.settings
          APP_ENV: test
        run: |
          python manage.py migrate --noinput
          python manage.py migrate --check
      - name: Verify pytest collection
        env:
          DB_NAME: wms_db_test
          DB_TEST_NAME: wms_ci_shard
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: mysql
          DB_PORT: 3306
          REDIS_HOST: redis
          REDIS_PORT: 6379
          SECRET_KEY: ci-test-key-0123456789abcdef0123456789abcdef0123456789abcdef
          DEBUG: 'False'
          DJANGO_SETTINGS_MODULE: wmsmaster.settings
          APP_ENV: test
        run: |
          python -m pytest --collect-only -q allapp
      - name: Run ${{ matrix.test-group }} tests
        env:
          DB_NAME: wms_db_test
          DB_TEST_NAME: wms_ci_shard
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: mysql
          DB_PORT: 3306
          REDIS_HOST: redis
          REDIS_PORT: 6379
          SECRET_KEY: ci-test-key-0123456789abcdef0123456789abcdef0123456789abcdef
          DEBUG: 'False'
          DJANGO_SETTINGS_MODULE: wmsmaster.settings
          APP_ENV: test
        run: |
          export COVERAGE_FILE=".coverage.${{ matrix.test-group }}"
          if [ "${{ matrix.test-group }}" = "platform" ]; then
            python -m pytest -n auto -q --tb=short --cov=allapp --cov-report= \
              --ignore=allapp/products/test_identifier_migrations.py \
              allapp/accounts \
              allapp/api \
              allapp/baseinfo \
              allapp/core \
              allapp/driverapp \
              allapp/labeling \
              allapp/locations \
              allapp/products \
              allapp/strategies
          elif [ "${{ matrix.test-group }}" = "warehouse" ]; then
            python -m pytest -n auto -q --tb=short --cov=allapp --cov-report= \
              allapp/inbound \
              allapp/inventory \
              allapp/outbound \
              allapp/tasking
          elif [ "${{ matrix.test-group }}" = "business-flows" ]; then
            python -m pytest -n auto -q --tb=short --cov=allapp --cov-report= \
              allapp/test_business_flows.py
          elif [ "${{ matrix.test-group }}" = "pos-sales" ]; then
            python -m pytest -n auto -q --tb=short --cov=allapp --cov-report= \
              allapp/pos
          else
            python -m pytest -n auto -q --tb=short --cov=allapp --cov-report= \
              allapp/reports \
              allapp/billing \
              allapp/console \
              allapp/salesapp
          fi
      - name: Upload test & coverage shards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.test-group }}
          path: |
            ./.coverage.${{ matrix.test-group }}

  test-serial:
    name: Full Test Suite (Clean DB, Serial)
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: wms_db_test
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpassword || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
      redis:
        image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
        options: >-
          --health-cmd="redis-cli ping || exit 1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmysqlclient-dev
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/test.txt
      - name: Django and migration checks
        env: &serial-test-env
          APP_ENV: test
          DB_NAME: wms_db_test
          DB_TEST_NAME: wms_ci_serial
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: mysql
          DB_PORT: 3306
          REDIS_HOST: redis
          REDIS_PORT: 6379
          SECRET_KEY: ci-test-key-0123456789abcdef0123456789abcdef0123456789abcdef
          DEBUG: 'False'
          DJANGO_SETTINGS_MODULE: wmsmaster.settings
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py migrate --check
      - name: Run clean serial suite with real migrations
        env: *serial-test-env
        run: >-
          python -m pytest -q --tb=short
          --ignore=allapp/products/test_identifier_migrations.py allapp

  identifier-migrations:
    name: Product Identifier Migrations (Fresh Schema, Serial)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: lint
    services:
      mysql:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: wms_db_test
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpassword || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmysqlclient-dev
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/test.txt
      - name: Run both migration assertions in one disposable schema
        env:
          APP_ENV: test
          DB_NAME: wms_db_test
          DB_TEST_NAME: wms_db_test
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: mysql
          DB_PORT: 3306
          SECRET_KEY: ci-test-key-0123456789abcdef0123456789abcdef0123456789abcdef
          DEBUG: 'False'
          DJANGO_SETTINGS_MODULE: wmsmaster.settings
        run: python -m pytest -vv --tb=short allapp/products/test_identifier_migrations.py

  sale-mini-payment-gate:
    name: Sale Mini Payment Release Gate
    runs-on: ubuntu-latest
    needs: [lint, test-serial]
    services:
      mysql:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: wms_db_test
          MYSQL_USER: wms_app
          MYSQL_PASSWORD: testpass123
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpassword || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
      redis:
        image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
        options: >-
          --health-cmd="redis-cli ping || exit 1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements/*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: sales-miniapp/package-lock.json
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmysqlclient-dev
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/test.txt
          npm ci --prefix sales-miniapp
      - name: Run mandatory payment release gate
        env:
          APP_ENV: test
          DB_NAME: wms_db_test
          DB_TEST_NAME: wms_sale_mini_gate
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: mysql
          DB_PORT: 3306
          REDIS_HOST: redis
          REDIS_PORT: 6379
          SECRET_KEY: ci-test-key-0123456789abcdef0123456789abcdef0123456789abcdef
          DEBUG: 'False'
          DJANGO_SETTINGS_MODULE: wmsmaster.settings
          VITE_API_BASE_URL: ${{ vars.WMS_PUBLIC_API_BASE_URL }}
        run: |
          npm --prefix sales-miniapp audit --omit=dev --audit-level=high
          npm --prefix sales-miniapp run test:release

  coverage-aggregate:
    name: Combine Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Download coverage shards
        uses: actions/download-artifact@v4
        with:
          pattern: pytest-*
          merge-multiple: true
      - name: Install coverage
        run: |
          python -m pip install --upgrade pip
          pip install coverage[toml] pytest-cov
      - name: Combine & report
        run: |
          shard_count="$(find . -type f -name '.coverage.*' | wc -l)"
          test "$shard_count" -eq 5
          coverage combine $(find . -type f -name '.coverage.*' -print)
          coverage xml -o coverage.xml
          coverage report --fail-under=70
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: combined
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        with:
          args: --no-git --redact
      - name: Ensure reports dir
        run: mkdir -p reports
      - name: Trivy (FS)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: false
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@v4.0.0
        with:
          project: 'WMS'
          path: '.'
          format: 'HTML'
          out: 'reports'
      - name: Upload OWASP results
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: reports/

  release-gate:
    name: Mandatory Release Gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - test-serial
      - identifier-migrations
      - coverage-aggregate
      - pda-client
      - owner-sale-client
      - boss-client
      - sale-mini-payment-gate
      - security
    steps:
      - name: Require every mandatory gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          results = {
              name: value.get("result")
              for name, value in json.loads(os.environ["NEEDS_JSON"]).items()
          }
          failed = {name: result for name, result in results.items() if result != "success"}
          if failed:
              print(f"Mandatory release gates failed: {failed}")
              sys.exit(1)
          print("All automated mandatory release gates passed.")
          PY

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [release-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      image_ref: ${{ steps.image-ref.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build candidate locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ secrets.DOCKER_USERNAME }}/wms:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy (Image)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/wms:${{ github.sha }}
          format: 'sarif'
          output: 'docker-scan-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: false
      - name: Smoke-test candidate image
        run: |
          docker run --rm "${{ secrets.DOCKER_USERNAME }}/wms:${{ github.sha }}" python -VV
          docker run --rm "${{ secrets.DOCKER_USERNAME }}/wms:${{ github.sha }}" python -m pip check
      - name: Generate candidate SBOM
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/wms:${{ github.sha }}
          format: cyclonedx
          output: candidate-sbom.cdx.json
      - name: Push scanned SHA candidate
        run: docker push "${{ secrets.DOCKER_USERNAME }}/wms:${{ github.sha }}"
      - name: Resolve immutable image digest
        id: image-ref
        env:
          IMAGE_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/wms
          IMAGE_TAG: ${{ github.sha }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$IMAGE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$digest"
          echo "value=$IMAGE_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ secrets.DOCKER_USERNAME }}/wms
          subject-digest: ${{ steps.image-ref.outputs.digest }}
          push-to-registry: true
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: candidate-sbom-${{ github.sha }}
          path: candidate-sbom.cdx.json
      - name: Upload Docker SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'docker-scan-results.sarif'

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.wms.example.com
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_KEY: ${{ secrets.STAGING_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
        run: |
          echo "$STAGING_KEY" > deploy_key
          chmod 600 deploy_key
          echo "$STAGING_KNOWN_HOSTS" > known_hosts
          chmod 600 known_hosts
          ssh -i deploy_key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes "$STAGING_USER@$STAGING_HOST" "IMAGE_REF='$IMAGE_REF' bash -s" <<'REMOTE'
            set -euo pipefail
            cd /app/wms
            export WMS_IMAGE="$IMAGE_REF"
            docker compose -f compose.production.yml pull
            docker compose -f compose.production.yml run --rm web python manage.py check --deploy
            docker compose -f compose.production.yml run --rm web python manage.py migrate --plan
            docker compose -f compose.production.yml stop scheduler
            docker compose -f compose.production.yml run --rm web python manage.py migrate --noinput
            docker compose -f compose.production.yml run --rm web python manage.py sync_wms_role_groups
            docker compose -f compose.production.yml run --rm web python manage.py collectstatic --noinput
            docker compose -f compose.production.yml up -d web
            docker compose -f compose.production.yml exec -T web python manage.py migrate --check
            docker compose -f compose.production.yml exec -T web python manage.py reconcile_data_accuracy --fail-on-issues
            docker compose -f compose.production.yml up -d scheduler
          REMOTE
