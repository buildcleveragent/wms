[project]
name = "wms"
version = "0.0.0"
requires-python = ">=3.12,<3.13"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["allapp"]
omit = ["*/tests.py", "*/test_*.py", "*/migrations/*", "*/generated/*"]

[tool.coverage.report]
fail_under = 70
