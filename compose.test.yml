name: wms-test

services:
  mysql-test:
    image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_TEST_NAME:?DB_TEST_NAME must be set}
      MYSQL_USER: ${DB_USER:?DB_USER must be set}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:${WMS_TEST_DB_PORT:-33306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Disposable local/CI schema: reduce DDL fsync amplification. Recovery
      # drills must use the production Compose durability settings instead.
      - --skip-log-bin
      - --sync-binlog=0
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-doublewrite=OFF
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 2s
      timeout: 3s
      retries: 90
      start_period: 60s
    volumes:
      - wms-test-mysql-data:/var/lib/mysql
    labels:
      com.wms.purpose: isolated-test-database

  redis-test:
    image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WMS_TEST_REDIS_PORT:-36379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - wms-test-redis-data:/data
    labels:
      com.wms.purpose: isolated-test-cache

volumes:
  wms-test-mysql-data:
    labels:
      com.wms.purpose: isolated-test-database
  wms-test-redis-data:
    labels:
      com.wms.purpose: isolated-test-cache
