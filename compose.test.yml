name: wms-test

services:
  mysql-test:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_TEST_NAME:?DB_TEST_NAME must be set}
      MYSQL_USER: ${DB_USER:?DB_USER must be set}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    ports:
      - "127.0.0.1:${WMS_TEST_DB_PORT:-33306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - wms-test-mysql-data:/var/lib/mysql
    labels:
      com.wms.purpose: isolated-test-database

volumes:
  wms-test-mysql-data:
    labels:
      com.wms.purpose: isolated-test-database
